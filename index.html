    <!-- Mobile & Responsive Design Rules (Media Queries for Mobile SEO & Cross-Device Layout) -->
    <style id="mobile-responsive-styles">
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        max-width: 100vw;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      img, picture, video, canvas, svg {
        max-width: 100%;
        height: auto;
      }
      a, button, input, select, textarea {
        touch-action: manipulation;
      }

      /* Mobile Portrait: Screen Width <= 480px */
      @media screen and (max-width: 480px) {
        body {
          font-size: 15px;
          line-height: 1.5;
          padding-bottom: 76px;
        }
        h1 {
          font-size: 26px !important;
          line-height: 1.2 !important;
        }
        h2 {
          font-size: 22px !important;
          line-height: 1.25 !important;
        }
        h3 {
          font-size: 18px !important;
          line-height: 1.3 !important;
        }
        .container, [class*="max-w-"] {
          width: 100% !important;
          max-width: 100% !important;
          padding-left: 12px !important;
          padding-right: 12px !important;
        }
        a, button, [role="button"] {
          min-height: 44px;
        }
      }

      /* Mobile Landscape / Phablet: Screen Width <= 640px */
      @media screen and (max-width: 640px) {
        body {
          padding-bottom: 76px;
        }
        .grid-responsive {
          grid-template-columns: 1fr !important;
        }
        .flex-mobile-col {
          flex-direction: column !important;
        }
        .mobile-w-full {
          width: 100% !important;
        }
        .mobile-text-center {
          text-align: center !important;
        }
        .mobile-hide {
          display: none !important;
        }
      }

      /* Tablets: Screen Width between 641px and 768px */
      @media screen and (min-width: 641px) and (max-width: 768px) {
        body {
          padding-bottom: 76px;
        }
        .tablet-grid-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
      }

      /* All Mobile & Tablet Screens <= 768px */
      @media screen and (max-width: 768px) {
        #mobile-sticky-cta {
          display: flex !important;
        }
        .desktop-nav {
          display: none !important;
        }
      }

      /* Desktop Screens: Screen Width >= 769px */
      @media screen and (min-width: 769px) {
        #mobile-sticky-cta {
          display: none !important;
        }
        .desktop-nav {
          display: flex !important;
        }
        body {
          padding-bottom: 0 !important;
        }
      }

      /* Medium to Large Screens: Screen Width between 769px and 1024px */
      @media screen and (min-width: 769px) and (max-width: 1024px) {
        .container, [class*="max-w-"] {
          max-width: 960px;
          margin-left: auto;
          margin-right: auto;
        }
      }

      /* Large Screens: Screen Width >= 1025px */
      @media screen and (min-width: 1025px) {
        .container, [class*="max-w-"] {
          max-width: 1152px;
          margin-left: auto;
          margin-right: auto;
        }
      }
